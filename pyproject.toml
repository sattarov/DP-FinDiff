    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "opacus>=1.6.0",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "sdv>=1.32.1",
    "seaborn>=0.13.2",
    "torch>=2.12.1",
    "tqdm>=4.68.3",
    "ucimlrepo>=0.0.7",
]
